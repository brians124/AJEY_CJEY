<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch and Listen — AJEY CJEY</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --night:#0d1033; --night-2:#171b57; --dawn:#f2a33a; --dawn-2:#ffd58a; --ember:#e8683a;
  --bg:#f5f6fb; --surface:#ffffff; --surface-2:#eceef8; --ink:#0f1233; --ink-2:#4a4f78;
  --line:#dcdff0; --accent:#a35d0b; --link:#2a30a3; --heart:#d63a3a;
  --shadow:0 1px 2px rgba(15,18,51,.06),0 10px 30px -12px rgba(15,18,51,.25);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:60px; --wrap:1160px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c26; --surface:#12153f; --surface-2:#1a1e52; --ink:#eef0ff; --ink-2:#a9aed6;
    --line:#262b66; --accent:#f2a33a; --link:#ffd58a; --heart:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c26; --surface:#12153f; --surface-2:#1a1e52; --ink:#eef0ff; --ink-2:#a9aed6;
  --line:#262b66; --accent:#f2a33a; --link:#ffd58a; --heart:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.7);
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night);scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--dawn);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:1em;height:1em;flex:none}
.meta{color:var(--ink-2);font-size:.88rem}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:800;letter-spacing:.05em;font-size:.9rem;white-space:nowrap;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn svg{font-size:1.15rem}
.btn-primary{background:linear-gradient(180deg,var(--dawn-2),var(--dawn));color:#1a1030;box-shadow:0 10px 26px -10px rgba(242,163,58,.8)}
.btn-solid{background:var(--night-2);color:#fff}
.btn-outline{border:2px solid var(--line);color:var(--ink);letter-spacing:.02em;font-weight:600}
.btn-outline:hover{background:var(--surface-2)}
.linkbtn{color:var(--link);font-weight:600;font-size:.9rem;padding:6px 0}
.linkbtn:hover{text-decoration:underline}

/* toggle pills (like / save) */
.act{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;transition:background .15s,color .15s,border-color .15s}
.act svg{font-size:1.2rem}
.act:hover{background:var(--surface-2)}
.act[aria-pressed="true"] svg{fill:currentColor}
.act[data-action="like"][aria-pressed="true"]{color:var(--heart);border-color:currentColor}
.act[data-action="save"][aria-pressed="true"]{color:var(--accent);border-color:currentColor}
.act.sm{min-height:36px;padding:0 10px;border:0;background:transparent;font-size:.85rem;gap:6px}
.act.icon{padding:0;width:44px;justify-content:center}
.act.dark{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.act.dark:hover{background:rgba(255,255,255,.18)}
.act.dark[data-action="like"][aria-pressed="true"]{color:#ff8a8a}
.act.dark[data-action="save"][aria-pressed="true"]{color:var(--dawn-2)}

/* ============ NAV ============ */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--nav-h);background:rgba(13,16,51,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:1.05rem}
.brand svg{width:28px;height:28px}

/* ============ PAGE SHELL ============ */
#app{padding-bottom:48px;min-height:70vh}
body.has-player #app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.page{padding-top:28px}
.page-head h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,8vw,3.2rem);line-height:1.02;letter-spacing:-.02em}
.page-head p{color:var(--ink-2);margin-top:8px;max-width:52ch}
.search{position:relative;margin-top:20px;max-width:560px}
.search input{width:100%;min-height:52px;border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:0 48px;font-size:1rem}
.search input:focus{border-color:var(--dawn);outline:none}
.search>svg{position:absolute;left:18px;top:50%;translate:0 -50%;font-size:1.2rem;color:var(--ink-2);pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.search .clear:hover{background:var(--surface-2)}

/* sticky chip bar */
.bar{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-top:18px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;max-width:var(--wrap);margin-inline:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--night-2);border-color:var(--night-2);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--dawn);border-color:var(--dawn);color:#1a1030}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--dawn);border-color:var(--dawn);color:#1a1030}

/* filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 4px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:.95rem;color:var(--ink);width:100%}
@media (min-width:760px){.filters{grid-template-columns:repeat(3,minmax(0,200px))}}
.resultbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px}
.resultbar h2{font-family:var(--display);font-weight:800;font-size:1.3rem}

/* covers and thumbs */
.cover,.thumb{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,240) 60% 26%),hsl(calc(var(--h,240) + 40) 70% 46%));display:grid;place-items:center;color:rgba(255,255,255,.85)}
.cover::after,.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,rgba(255,220,150,.38),transparent 55%);pointer-events:none}
.cover img,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover{aspect-ratio:1;border-radius:12px}
.cover svg{width:34%;height:34%}
.thumb{aspect-ratio:16/9;border-radius:16px}
.thumb .ico{position:absolute;z-index:2;left:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);color:#1a1030;display:grid;place-items:center}
.thumb .ico svg{width:18px;height:18px;margin-left:2px}
.badge{position:absolute;z-index:2;right:10px;bottom:10px;background:rgba(13,16,51,.82);color:#fff;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:8px}
.tag{position:absolute;z-index:2;left:10px;top:10px;background:rgba(13,16,51,.75);color:#fff;font-size:.76rem;font-weight:600;padding:3px 10px;border-radius:999px}

/* ============ WATCH ============ */
.vgrid{display:grid;gap:26px 20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.vcard{display:flex;flex-direction:column;gap:12px}
.vcard .thumb{transition:transform .2s}
.vcard:hover .thumb{transform:scale(1.015)}
.vcard h3{font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.28}
.vcard .sub{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.vcard.compact{display:grid;grid-template-columns:148px 1fr;gap:12px;align-items:start}
.vcard.compact h3{font-size:.98rem}
.vcard.compact .thumb{border-radius:12px}
.vcard.compact .thumb .ico{display:none}
.vhero{display:grid;gap:0;border-radius:16px;overflow:hidden;background:linear-gradient(140deg,var(--night),var(--night-2) 60%,#3b2470);color:#fff;box-shadow:var(--shadow);margin-top:26px}
.vhero .thumb{border-radius:0;aspect-ratio:16/10}
.vhero-body{padding:24px 22px 28px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.vhero-body h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.08}
.vhero-body p{color:rgba(255,255,255,.8)}
.vhero-body .meta{color:rgba(255,255,255,.65)}
@media (min-width:860px){.vhero{grid-template-columns:1.25fr 1fr}.vhero .thumb{aspect-ratio:auto;min-height:340px}.vhero-body{padding:40px;justify-content:center}}

/* detail */
.detail{display:grid;gap:32px;padding-top:20px}
@media (min-width:1000px){.detail{grid-template-columns:minmax(0,1fr) 360px;gap:40px}}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--link);min-height:40px}
.back svg{font-size:1.2rem}
.vplayer{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin-top:8px}
.vplayer iframe,.vplayer video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vplayer .thumb{position:absolute;inset:0;border-radius:0;aspect-ratio:auto}
.vplayer .note{position:absolute;z-index:3;left:14px;right:14px;bottom:12px;color:#fff;font-size:.85rem;background:rgba(13,16,51,.75);padding:8px 12px;border-radius:10px}
.vplayer .bigplay{position:absolute;z-index:3;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--dawn-2);color:#1a1030;display:grid;place-items:center}
.vplayer .bigplay svg{width:30px;height:30px;margin-left:4px}
.detail h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5.5vw,2.2rem);line-height:1.12;margin-top:18px;letter-spacing:-.01em}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px;color:var(--ink-2);font-size:.92rem}
.dmeta a{color:var(--link);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.desc{margin-top:20px;background:var(--surface);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.desc .txt{font-family:var(--serif);font-size:1.08rem;line-height:1.6;color:var(--ink-2)}
.desc.clamp .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.desc .tags span{font-size:.82rem;font-weight:600;background:var(--surface-2);padding:4px 12px;border-radius:999px}
.desc.clamp .tags{display:none}
.related h2,.cm-sec h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:16px}
.related .list{display:grid;gap:16px}

/* comments */
.cm-sec{margin-top:36px}
.cm-head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.cm-head-row h2{margin:0}
.cm-head-row .select{width:auto;min-height:40px}
.composer{display:flex;gap:12px;align-items:flex-start}
.composer .fields{flex:1;display:flex;flex-direction:column;gap:10px;align-items:flex-end;min-width:0}
.composer textarea{width:100%;min-height:52px;resize:vertical;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:13px 16px;font-size:1rem}
.composer textarea:focus{border-color:var(--dawn);outline:none}
.composer .btn{min-height:42px;padding:0 20px}
.composer .btn:disabled{opacity:.45;cursor:not-allowed}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h,240) 60% 32%),hsl(calc(var(--h,240) + 40) 70% 52%))}
.cm-list{display:grid;gap:22px;margin-top:24px}
.cm{display:flex;gap:12px}
.cm-main{flex:1;min-width:0}
.cm-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cm-text{margin-top:2px;overflow-wrap:anywhere}
.cm-actions{display:flex;align-items:center;gap:6px;margin-top:4px;margin-left:-10px}
.cm-actions .linkbtn{padding:0 10px}
.reply-slot:not(:empty){margin:10px 0 4px}
.cm-list.nested{margin-top:16px;gap:16px}
.cm-list.nested .avatar{width:32px;height:32px;font-size:.8rem}

/* ============ LISTEN ============ */
.lsec{margin-top:40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.1;letter-spacing:-.01em}
.sec-head .linkbtn{white-space:nowrap}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-20px;padding:2px 20px 14px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
@media (min-width:700px){.shelf{grid-auto-columns:176px;gap:18px}}
.tcard,.pcard{scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;text-align:left}
.tcard .cover-wrap{position:relative}
.tcard .cover{box-shadow:var(--shadow)}
.tcard .pl{position:absolute;right:8px;bottom:8px;z-index:3;width:42px;height:42px;border-radius:50%;background:var(--dawn-2);color:#1a1030;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.5)}
.tcard .pl svg{width:18px;height:18px}
.tcard h3,.pcard h3{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.25}
.pcard .cover{border-radius:16px}
.lhero-row{display:grid;grid-auto-flow:column;grid-auto-columns:min(84%,360px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 14px;scrollbar-width:none}
.lhero-row::-webkit-scrollbar{display:none}
.lhero{scroll-snap-align:start;position:relative;min-height:220px;border-radius:16px;overflow:hidden;color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:linear-gradient(150deg,hsl(var(--h,260) 65% 24%),hsl(calc(var(--h,260) + 50) 75% 48%));text-align:left;box-shadow:var(--shadow)}
.lhero::before{content:"";position:absolute;right:-30%;top:-40%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.5),transparent 65%)}
.lhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.lhero>*{position:relative}
.lhero h3{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05}
.lhero .meta{color:rgba(255,255,255,.8)}
.lhero .go{margin-top:10px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--dawn-2);color:#1a1030;font-weight:800;font-size:.85rem;letter-spacing:.05em;padding:0 20px;min-height:44px;border-radius:999px}
@media (min-width:900px){.lhero-row{grid-auto-columns:380px}}

.tlist{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);padding-right:8px}
.trow:last-child{border-bottom:0}
.trow-main{display:grid;grid-template-columns:auto 52px minmax(0,1fr);gap:12px;align-items:center;padding:10px 8px 10px 14px;text-align:left;min-height:68px}
.trow-main:hover{background:var(--surface-2)}
.trow .rank{width:22px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--accent)}
.trow .no-rank .rank{display:none}
.trow-main.no-rank{grid-template-columns:52px minmax(0,1fr)}
.trow .cover{border-radius:10px}
.trow .cover svg{width:44%;height:44%}
.trow h3{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .txt{min-width:0}
.trow .tail{display:flex;align-items:center;gap:2px}
.trow .dur{font-size:.85rem;color:var(--ink-2);min-width:38px;text-align:right;padding-right:6px}
@media (max-width:420px){.trow .dur{display:none}}
.is-current h3{color:var(--accent)}
.eq{position:absolute;inset:0;z-index:3;display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:30%;background:rgba(13,16,51,.55)}
.is-current .eq{display:flex}
.eq i{display:block;width:4px;height:8px;background:var(--dawn-2);border-radius:2px}
.is-playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{0%,100%{height:6px}50%{height:20px}}

.pl-head{display:grid;gap:20px;padding-top:20px;align-items:end}
.pl-head .cover{width:min(60vw,240px);border-radius:16px;box-shadow:var(--shadow)}
.pl-head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,3rem);line-height:1.02;letter-spacing:-.02em}
.pl-head .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
@media (min-width:700px){.pl-head{grid-template-columns:240px 1fr;gap:32px}}

/* ============ MINI PLAYER ============ */
.mini{position:fixed;z-index:60;left:12px;right:12px;margin-inline:auto;max-width:760px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(23,27,87,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border-radius:16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.mini[hidden]{display:none}
.mini-bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.15)}
.mini-bar i{display:block;height:100%;width:0;background:var(--dawn)}
.mini-main{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:10px 6px 10px 10px;text-align:left;color:inherit;min-height:68px}
.mini-main .cover{border-radius:10px}
.mini-main .cover svg{width:44%;height:44%}
.mini-main b{display:block;font-family:var(--display);font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-main span{display:block;font-size:.84rem;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ctrls{display:flex;align-items:center;gap:2px;padding-right:8px}
.pbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.3rem}
.pbtn:hover{background:rgba(255,255,255,.12)}

    if (p.category) a = a.filter(v => v.category === p.category);
    if (p.featured) a = a.filter(v => v.featured);
    if (p.q) { const q = p.q.toLowerCase(); a = a.filter(v => (v.title + " " + v.speaker + " " + (v.tags||[]).join(" ")).toLowerCase().includes(q)); }
    if (p.duration === "short") a = a.filter(v => v.duration < 600);
    if (p.duration === "medium") a = a.filter(v => v.duration >= 600 && v.duration <= 1800);
    if (p.duration === "long") a = a.filter(v => v.duration > 1800);
    const sorters = { new:(x,y)=>new Date(y.publishedAt)-new Date(x.publishedAt), popular:(x,y)=>y.views-x.views, liked:(x,y)=>y.likes-x.likes };
    a.sort(sorters[p.sort] || sorters.new);
    return page(a, p.page, p.pageSize);
  },
  related(id){
    const v = SAMPLE.videos.find(x => x.id === id); if (!v) return {items:[],total:0};
    const others = SAMPLE.videos.filter(x => x.id !== id);
    const items = [...others.filter(x => x.category === v.category), ...others.filter(x => x.category !== v.category).sort((a,b)=>b.views-a.views)].slice(0,6);
    return {items,total:items.length};
  },
  tracks(p){
    let a = [...SAMPLE.tracks];
    if (p.genre) a = a.filter(t => t.genre === p.genre);
    if (p.featured) a = a.filter(t => t.featured);
    if (p.q) { const q = p.q.toLowerCase(); a = a.filter(t => (t.title + " " + t.artist + " " + (t.album||"")).toLowerCase().includes(q)); }
    const sorters = { new:(x,y)=>new Date(y.releasedAt)-new Date(x.releasedAt), plays:(x,y)=>y.plays-x.plays, az:(x,y)=>x.title.localeCompare(y.title) };
    a.sort(sorters[p.sort] || sorters.new);
    return page(a, p.page, p.pageSize || p.limit);
  },
  playlists(){
    const items = SAMPLE.playlists.map(({trackIds,...p}) => ({...p, trackCount:trackIds.length}));
    return {items,total:items.length};
  },
  playlist(id){
    const p = SAMPLE.playlists.find(x => x.id === id); if (!p) return null;
    const tracks = p.trackIds.map(i => SAMPLE.tracks.find(t => t.id === i));
    const {trackIds,...rest} = p; return {...rest, trackCount:tracks.length, tracks};
  },
  _comments:{},
  comments(id){
    if (!this._comments[id]){
      const pool = [["Grace M.","This spoke straight to my heart. Thank you for sharing.",14],["Daniel K.","Watching from Entebbe. God bless this ministry!",9],["Ruth A.","Just what I needed this morning. Amen.",6],["Peter L.","Could you do a follow-up on this topic?",3],["Esther N.","Sharing this with my youth group tonight.",2]];
      const n = parseInt(id.replace(/\D/g,""),10) || 1;
      this._comments[id] = [0,1,2].map(k => { const c = pool[(n + k) % pool.length];
        return {id:`${id}-c${k}`, author:c[0], text:c[1], likes:c[2]*(k+1), createdAt:ago(k*2+1), replies:k===0?[{id:`${id}-c0r`,author:"AJEY Team",text:"Thank you for watching. We are glad this blessed you.",likes:3,createdAt:ago(0.5)}]:[]}; });
    }
    return {items:this._comments[id],total:this._comments[id].length};
  },
  addComment(id,{text,parentId}){
    this.comments(id);
    const c = {id:`${id}-n${Date.now()}`,author:"You",text,likes:0,createdAt:new Date().toISOString(),replies:[]};
    if (parentId){ const p = this._comments[id].find(x => x.id === parentId); (p ? p.replies : this._comments[id]).push(c); }
    else this._comments[id].unshift(c);
    return c;
  }
};
function page(a, pg, size){ const total = a.length; size = +size || total || 1; pg = +pg || 1; return {items:a.slice((pg-1)*size, pg*size), total}; }

/* =====================================================================
   API — one place that talks to your backend.
   GET  /categories/watch                      -> Category[]
   GET  /videos?q&category&sort(new|popular|liked)&duration(short|medium|long)&ids&featured&page&pageSize -> {items,total}
   GET  /videos/:id                            -> Video
   GET  /videos/:id/related                    -> {items}
   GET  /videos/:id/comments                   -> {items,total}
   POST /videos/:id/comments  {text,parentId}  -> Comment
   GET  /tracks?q&genre&featured&sort(new|plays|az)&page&pageSize|limit -> {items,total}
   GET  /playlists                             -> {items}
   GET  /playlists/:id                         -> Playlist (with tracks)
   POST /reactions {kind:'like'|'save', type:'video'|'track'|'comment'|'playlist', id, on:boolean}
   POST /plays {trackId}
   ===================================================================== */
const delay = ms => new Promise(r => setTimeout(r, ms));
async function remote(path, {method="GET", params, body} = {}, sample){
  if (CONFIG.apiBase){
    try {
      const u = new URL(CONFIG.apiBase.replace(/\/$/,"") + path);
      Object.entries(params || {}).forEach(([k,v]) => { if (v !== "" && v != null) u.searchParams.set(k, v); });
      const r = await fetch(u, {method, headers:{Accept:"application/json", ...(body ? {"Content-Type":"application/json"} : {})}, body: body ? JSON.stringify(body) : undefined});
      if (r.ok) return await r.json();
      if (!CONFIG.fallbackToSample) throw new Error("API " + r.status);
    } catch (e) { if (!CONFIG.fallbackToSample) throw e; }
  }
  await delay(140);
  return sample();
}
const API = {
  categories: () => remote("/categories/watch", {}, () => SAMPLE.categories),
  videos: p => remote("/videos", {params:p}, () => Sample.videos(p)),
  video: id => remote(`/videos/${id}`, {}, () => SAMPLE.videos.find(v => v.id === id) || null),
  related: id => remote(`/videos/${id}/related`, {}, () => Sample.related(id)),
  comments: id => remote(`/videos/${id}/comments`, {}, () => Sample.comments(id)),
  postComment: (id, body) => remote(`/videos/${id}/comments`, {method:"POST", body}, () => Sample.addComment(id, body)),
  tracks: p => remote("/tracks", {params:p}, () => Sample.tracks(p)),
  playlists: () => remote("/playlists", {}, () => Sample.playlists()),
  playlist: id => remote(`/playlists/${id}`, {}, () => Sample.playlist(id)),
  react: (kind, type, id, on) => { if (CONFIG.apiBase) remote("/reactions", {method:"POST", body:{kind,type,id,on}}, () => null).catch(()=>{}); },
  played: t => { if (CONFIG.apiBase) remote("/plays", {method:"POST", body:{trackId:t.id}}, () => null).catch(()=>{}); }
};

/* =====================================================================
   PLAYER ENGINE — real <audio> when a track has audioUrl,
   otherwise a simulated clock so the UI is fully testable without files.
   ===================================================================== */
const Player = {
  queue:[], index:-1, playing:false, time:0, duration:0, shuffle:false, repeat:"off", history:[],
  audio:new Audio(), sim:null, subs:new Set(),
  get track(){ return this.queue[this.index] || null; },
  emit(t){ this.subs.forEach(f => f(t)); },
  play(list, i = 0){ this.queue = list.slice(); this.history = []; this.load(i, true); },
  load(i, autoplay){
    const t = this.queue[i]; if (!t) return;
    this.index = i; this.time = 0; this.duration = t.duration || 0; this.stopSim();
    if (t.audioUrl){ this.audio.src = t.audioUrl; this.audio.load(); } else { this.audio.removeAttribute("src"); }
    this.emit("track"); API.played(t);
    if (autoplay) this.resume(); else { this.playing = false; this.emit("state"); }
  },
  resume(){
    if (!this.track) return; this.playing = true;
    if (this.track.audioUrl) this.audio.play().catch(() => { toast("Could not play this track"); this.pause(); });
    else this.startSim();
    this.emit("state");
  },
  pause(){ this.playing = false; this.audio.pause(); this.stopSim(); this.emit("state"); },
  toggle(){ this.playing ? this.pause() : this.resume(); },
  startSim(){ this.stopSim(); this.sim = setInterval(() => { this.time += .25; if (this.time >= this.duration) this.ended(); else this.emit("time"); }, 250); },
  stopSim(){ clearInterval(this.sim); this.sim = null; },
  seek(s){
    this.time = Math.min(Math.max(0, s), this.duration || 0);
    if (this.track && this.track.audioUrl) this.audio.currentTime = this.time;
    this.emit("time");
  },
  ended(){
    if (this.repeat === "one"){ this.seek(0); if (this.track.audioUrl) this.audio.play().catch(()=>{}); return; }
    this.next(true);
  },
  next(auto){
    const n = this.queue.length; if (!n) return;
    let i;
    if (this.shuffle && n > 1){ do { i = Math.floor(Math.random() * n); } while (i === this.index); this.history.push(this.index); }
    else { i = this.index + 1; if (i >= n){ if (this.repeat === "all") i = 0; else if (auto){ this.pause(); this.seek(0); return; } else i = 0; } }
    this.load(i, true);
  },
  prev(){
    if (this.time > 3){ this.seek(0); return; }
    if (this.shuffle && this.history.length){ this.load(this.history.pop(), true); return; }
    const n = this.queue.length; this.load(this.index - 1 < 0 ? (this.repeat === "all" ? n - 1 : 0) : this.index - 1, true);
  },
  toggleShuffle(){ this.shuffle = !this.shuffle; this.emit("mode"); },
  cycleRepeat(){ this.repeat = {off:"all", all:"one", one:"off"}[this.repeat]; this.emit("mode"); }
};
Player.audio.addEventListener("timeupdate", () => { if (Player.track && Player.track.audioUrl){ Player.time = Player.audio.currentTime; Player.emit("time"); } });
Player.audio.addEventListener("loadedmetadata", () => { if (isFinite(Player.audio.duration)){ Player.duration = Player.audio.duration; Player.emit("time"); } });
Player.audio.addEventListener("ended", () => Player.ended());
Player.audio.addEventListener("error", () => { if (Player.track && Player.track.audioUrl){ toast("Audio unavailable"); Player.pause(); } });
document.addEventListener("play", e => { if (e.target.tagName === "VIDEO") Player.pause(); }, true);

/* ---------- player UI (built once; painted by events) ---------- */
const mini = $("#mini"), full = $("#full");
$$('[data-action="p-prev"]').forEach(b => { if (!b.dataset.icon) b.insertAdjacentHTML("afterbegin", I("prev")); });
$$('[data-action="p-next"]').forEach(b => { if (!b.dataset.icon) b.insertAdjacentHTML("afterbegin", I("next")); });
$("#fullToggles").innerHTML = Toggle({action:"like", type:"track", id:"", label:"Like track", icon:"heart", count:false, cls:"dark icon"}) + Toggle({action:"save", type:"track", id:"", label:"Save track", icon:"bookmark", count:false, cls:"dark icon"});
const binds = name => $$(`[data-bind="${name}"]`);

function paintTrack(){
  const t = Player.track; if (!t) return;
  mini.hidden = false; document.body.classList.add("has-player");
  binds("cover").forEach(el => { el.innerHTML = Cover(t); });
  binds("title").forEach(el => el.textContent = t.title);
  binds("artist").forEach(el => el.textContent = t.artist);
  full.style.setProperty("--h", +t.hue || hueOf(t.title));
  $$("#fullToggles [data-action]").forEach(b => { b.dataset.id = t.id; });
  syncToggles(full);
  try {
    if ("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist, album:t.album || ""});
    }
  } catch(_){}
  paintTime(); paintQueue(); paintNowPlaying();
}
function paintState(){
  binds("play").forEach(b => { b.innerHTML = I(Player.playing ? "pause" : "play"); b.setAttribute("aria-label", Player.playing ? "Pause" : "Play"); });
  try { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = Player.playing ? "playing" : "paused"; } catch(_){}
  paintNowPlaying();
}
function paintTime(){
  const d = Player.duration || 0, p = d ? (Player.time / d) * 100 : 0;
  binds("cur").forEach(e => e.textContent = fmtTime(Player.time));
  binds("dur").forEach(e => e.textContent = fmtTime(d));
  binds("bar").forEach(e => e.style.width = p + "%");
  binds("seek").forEach(e => { e.max = d || 100; e.value = Player.time; e.style.setProperty("--p", p + "%"); });
}
function paintMode(){
  const sh = binds("shuffle")[0], rp = binds("repeat")[0];
  sh.classList.toggle("on", Player.shuffle); sh.setAttribute("aria-pressed", Player.shuffle);
  rp.classList.toggle("on", Player.repeat !== "off");
  rp.innerHTML = I(Player.repeat === "one" ? "repeat1" : "repeat");
  rp.setAttribute("aria-label", "Repeat: " + Player.repeat);
}
function paintNowPlaying(){
  const id = Player.track && Player.track.id;
  $$("[data-track-id]").forEach(el => { el.classList.toggle("is-current", el.dataset.trackId === id); el.classList.toggle("is-playing", el.dataset.trackId === id && Player.playing); });
}
function paintQueue(){
  Ctx.set("__queue", Player.queue);
  $("#queueList").innerHTML = `<ul>${Player.queue.map((t, i) => TrackRow(t, "__queue", i)).join("")}</ul>`;
  syncToggles($("#queueList")); paintNowPlaying();
}
Player.subs.add(type => {
  if (type === "track") { paintTrack(); paintState(); }
  else if (type === "state") paintState();
  else if (type === "time") paintTime();
  else if (type === "mode") paintMode();
});
paintMode(); paintState();
binds("seek").forEach(el => el.addEventListener("input", () => Player.seek(+el.value)));
try {
  if ("mediaSession" in navigator){
    const ms = navigator.mediaSession;
    ms.setActionHandler("play", () => Player.resume()); ms.setActionHandler("pause", () => Player.pause());
    ms.setActionHandler("nexttrack", () => Player.next()); ms.setActionHandler("previoustrack", () => Player.prev());
    ms.setActionHandler("seekto", d => Player.seek(d.seekTime));
  }
} catch(_){}

let lastFocus = null;
function openFull(){
  if (!Player.track) return; lastFocus = document.activeElement;
  full.classList.add("open"); full.removeAttribute("inert"); full.setAttribute("aria-hidden", "false");
  $("#shell").inert = true; $('[data-action="close-player"]', full).focus();
}
function closeFull(){
  full.classList.remove("open", "show-queue"); full.setAttribute("inert", ""); full.setAttribute("aria-hidden", "true");
  $("#shell").inert = false; if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* =====================================================================
   ACTIONS — every click is routed here by data-action (event delegation)
   ===================================================================== */
const View = { state:{}, set(){}, reset(){}, more(){} };
const Actions = {
  like(el){ react(el, "likes"); },
  save(el){ react(el, "saves"); },
  share(el){ share({title:el.dataset.title, path:el.dataset.path}); },
  "share-track"(){ const t = Player.track; if (t) share({title:t.title, path:`/listen?tab=all&q=${encodeURIComponent(t.title)}`}); },
  "play-track"(el){
    const list = Ctx.get(el.dataset.ctx), i = +el.dataset.index, t = list[i];
    if (Player.track && t && Player.track.id === t.id && el.dataset.ctx !== "__queue" ) { Player.toggle(); return; }
    Player.play(list, i);
  },
  "play-all"(el){ const l = Ctx.get(el.dataset.ctx); if (l.length){ Player.shuffle = false; Player.emit("mode"); Player.play(l, 0); } },
  "shuffle-all"(el){ const l = Ctx.get(el.dataset.ctx); if (l.length){ Player.shuffle = true; Player.emit("mode"); Player.play(l, Math.floor(Math.random() * l.length)); } },
  "open-player": openFull, "close-player": closeFull,
  "toggle-queue"(){ full.classList.toggle("show-queue"); },
  "p-toggle"(){ Player.toggle(); }, "p-next"(){ Player.next(); }, "p-prev"(){ Player.prev(); },
  "p-shuffle"(){ Player.toggleShuffle(); }, "p-repeat"(){ Player.cycleRepeat(); },
  "set-filter"(el){ View.set(el.dataset.key, el.dataset.value); },
  "reset-filters"(){ View.reset(); },
  "load-more"(){ View.more(); },
  "clear-search"(){ const i = $('[data-role="search"]'); i.value = ""; i.focus(); View.set("q", ""); },
  "toggle-desc"(el){ const d = el.closest(".desc"); const c = d.classList.toggle("clamp"); el.textContent = c ? "Show more" : "Show less"; },
  "reply-toggle"(el){
    const slot = $(`[data-reply-for="${CSS.escape(el.dataset.id)}"]`); if (!slot) return;
    if (slot.innerHTML) { slot.innerHTML = ""; return; }
    slot.innerHTML = Composer({vid:View.state.id, parent:el.dataset.id, placeholder:"Write a reply", cta:"Reply"}); $("textarea", slot).focus();
  },
  async "post-comment"(el){
    const ta = $("textarea", el.closest(".composer")), text = ta.value.trim(); if (!text) return;
    el.disabled = true;
    try { await API.postComment(el.dataset.video, {text, parentId:el.dataset.parent || null}); ta.value = ""; toast("Comment posted"); await View.reloadComments(); }
    catch(_){ toast("Could not post comment"); el.disabled = false; }
  }
};
function react(el, kind){
  const on = Store.toggle(kind, el.dataset.type, el.dataset.id);
  syncToggles(); API.react(kind === "likes" ? "like" : "save", el.dataset.type, el.dataset.id, on);
  if (kind === "saves") toast(on ? "Saved to your library" : "Removed from saved");
}
document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (el && Actions[el.dataset.action]) Actions[el.dataset.action](el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-filter]"); if (el) View.set(el.dataset.filter, el.value); });
let searchT;
document.addEventListener("input", e => {
  const s = e.target.closest('[data-role="search"]');
  if (s){ $(".clear", s.parentNode).classList.toggle("hidden", !s.value); clearTimeout(searchT); searchT = setTimeout(() => View.set("q", s.value.trim()), 250); }
  const c = e.target.closest("[data-composer]");
  if (c){ $(".btn", c.closest(".composer")).disabled = !c.value.trim(); c.style.height = "auto"; c.style.height = Math.min(c.scrollHeight, 180) + "px"; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (full.classList.contains("show-queue")) full.classList.remove("show-queue"); else if (full.classList.contains("open")) closeFull(); }
  if (e.key === " " && full.classList.contains("open") && !/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)){ e.preventDefault(); Player.toggle(); }
});

/* =====================================================================
   ROUTER + VIEWS
   #/watch?cat&q&sort&dur&show   #/watch/video/:id
   #/listen?tab&q                #/listen/playlist/:id
   ===================================================================== */
const app = $("#app");
function paint(el, html){ el.innerHTML = html; syncToggles(el); paintNowPlaying(); }
function setUrl(path, params){ const qs = new URLSearchParams(); Object.entries(params).forEach(([k,v]) => { if (v) qs.set(k, v); }); history.replaceState(null, "", "#" + path + (qs.toString() ? "?" + qs : "")); }
let token = 0;

/* ---- WATCH library ---- */
async function viewWatch(qs){
  document.title = "Watch — AJEY CJEY";
  const my = ++token;
  State.cats = await API.categories();
  if (my !== token) return;
  const DEF = {cat:"all", q:"", sort:"new", dur:"any", show:"all"};
  const st = {cat:qs.get("cat") || DEF.cat, q:qs.get("q") || "", sort:qs.get("sort") || DEF.sort, dur:qs.get("dur") || DEF.dur, show:qs.get("show") || DEF.show, page:1, items:[], total:0};
  const opt = (v, cur, l) => `<option value="${v}"${v === cur ? " selected" : ""}>${l}</option>`;
  app.innerHTML = `
    <div class="wrap page"><header class="page-head"><h1>Watch</h1><p>Sermons, worship, devotionals and more. Search, filter and save what speaks to you.</p></header>
    ${SearchBox({value:st.q, placeholder:"Search videos, speakers or topics"})}</div>
    <div class="bar"><div class="chips" id="chips" role="group" aria-label="Categories"></div></div>
    <div class="wrap">
      <div class="filters">
        <label>Sort by<select class="select" data-filter="sort">${opt("new",st.sort,"Newest")}${opt("popular",st.sort,"Most viewed")}${opt("liked",st.sort,"Most liked")}</select></label>
        <label>Length<select class="select" data-filter="dur">${opt("any",st.dur,"Any length")}${opt("short",st.dur,"Under 10 min")}${opt("medium",st.dur,"10 to 30 min")}${opt("long",st.dur,"Over 30 min")}</select></label>
        <label>Show<select class="select" data-filter="show">${opt("all",st.show,"All videos")}${opt("saved",st.show,"Saved by me")}${opt("liked",st.show,"Liked by me")}</select></label>
      </div>
      <div id="feature"></div>
      <div class="resultbar"><h2 id="count"></h2></div>
      <div class="vgrid" id="grid"></div><div class="more-wrap" id="more"></div>
    </div>`;
  const chips = () => paint($("#chips"), Chip({label:"All", key:"cat", value:"all", active:st.cat === "all"}) + State.cats.map(c => Chip({label:c.name, key:"cat", value:c.slug, active:st.cat === c.slug})).join(""));
  chips();
  const isDefault = () => st.cat === "all" && !st.q && st.sort === "new" && st.dur === "any" && st.show === "all";
  async function refresh(append){
    const run = ++token;
    if (!append){ st.page = 1; st.items = []; $("#grid").innerHTML = Skel("v", 6); $("#more").innerHTML = ""; }
    const params = {q:st.q, category:st.cat === "all" ? "" : st.cat, sort:st.sort, duration:st.dur === "any" ? "" : st.dur, page:st.page, pageSize:CONFIG.pageSize};
    if (st.show !== "all") params.ids = Store.list(st.show === "saved" ? "saves" : "likes", "video").join(",");
    let res;
    try { res = st.show !== "all" && !params.ids ? {items:[], total:0} : await API.videos(params); } catch(_){ if (run === token) paint($("#grid"), Empty({title:"Could not load videos", text:"Check your connection and try again.", action:{action:"reset-filters", label:"Try again"}})); return; }
    if (run !== token) return;
    st.items = append ? st.items.concat(res.items) : res.items; st.total = res.total;
    const catLabel = st.cat === "all" ? "" : ` in ${(State.cats.find(c => c.slug === st.cat) || {}).name}`;
    $("#count").textContent = st.q ? `${st.total} result${st.total === 1 ? "" : "s"} for “${st.q}”` : `${st.total} video${st.total === 1 ? "" : "s"}${catLabel}`;
    paint($("#grid"), st.items.length ? st.items.map(v => VideoCard(v)).join("") : Empty({title:"No videos found", text:"Try a different search or clear your filters.", action:{action:"reset-filters", label:"Clear filters"}}));
    $("#more").innerHTML = st.items.length < st.total ? `<button class="btn btn-outline" type="button" data-action="load-more">Show more videos</button>` : "";
    if (!append){
      if (isDefault()){ const f = await API.videos({featured:1, pageSize:1}); if (run === token && f.items[0]) $("#feature").innerHTML = VideoHero(f.items[0]); }
      else $("#feature").innerHTML = "";
    }
  }
  View.state = st;
  View.set = (k, v) => { st[k === "cat" ? "cat" : k] = v; setUrl("/watch", {cat:st.cat === "all" ? "" : st.cat, q:st.q, sort:st.sort === "new" ? "" : st.sort, dur:st.dur === "any" ? "" : st.dur, show:st.show === "all" ? "" : st.show}); if (k === "cat") chips(); refresh(false); };
  View.reset = () => { Object.assign(st, DEF); $$("[data-filter]").forEach(s => s.value = st[s.dataset.filter]); const i = $('[data-role="search"]'); i.value = ""; $(".clear", i.parentNode).classList.add("hidden"); chips(); setUrl("/watch", {}); refresh(false); };
  View.more = () => { st.page++; refresh(true); };
  await refresh(false);
}

/* ---- WATCH detail ---- */
async function viewVideo(id){
  const my = ++token;
  app.innerHTML = `<div class="wrap detail"><div><div class="skel v"></div></div></div>`;
  State.cats = State.cats.length ? State.cats : await API.categories();
  const v = await API.video(id);
  if (my !== token) return;
  if (!v){ app.innerHTML = `<div class="wrap page">${Empty({title:"Video not found", text:"It may have been removed or the link is wrong."})}<p style="text-align:center;margin-top:16px"><a class="btn btn-primary" href="#/watch">BACK TO WATCH</a></p></div>`; return; }
  document.title = v.title + " — AJEY CJEY";
  const path = `/watch/video/${encodeURIComponent(v.id)}`;
  paint(app, `<div class="wrap detail"><div>
    <a class="back" href="#/watch">${I("back")}Back to Watch</a>
    ${VideoPlayer(v)}
    <h1>${esc(v.title)}</h1>
    <div class="dmeta"><span>${esc(v.speaker)}</span><a href="#/watch?cat=${encodeURIComponent(v.category)}">${esc(catName(v))}</a><span>${fmtNum(v.views)} views</span><span>${fmtAgo(v.publishedAt)}</span></div>
    <div class="actions">
      ${Toggle({action:"like", type:"video", id:v.id, base:v.likes, label:"Like this video", icon:"heart"})}
      ${Toggle({action:"save", type:"video", id:v.id, label:"Save this video", icon:"bookmark"})}
      <button class="act" type="button" data-action="share" data-title="${esc(v.title)}" data-path="${path}">${I("share")}Share</button>
      <a class="act" href="#comments">${I("comment")}<span id="cmCount">Comments</span></a>
    </div>
    <div class="desc clamp"><p class="txt">${esc(v.description)}</p><div class="tags">${(v.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <button class="linkbtn" type="button" data-action="toggle-desc" style="margin-top:8px">Show more</button></div>
    <section class="cm-sec" id="comments" aria-label="Comments">
      <div class="cm-head-row"><h2 id="cmTitle">Comments</h2><select class="select" data-filter="csort" aria-label="Sort comments"><option value="top">Top comments</option><option value="new">Newest first</option></select></div>
      ${Composer({vid:v.id})}<ul class="cm-list" id="cmList">${Skel("r", 2)}</ul></section>
  </div>
  <aside class="related" aria-label="Related videos"><h2>Related videos</h2><div class="list" id="related">${Skel("v", 3)}</div></aside></div>`);
  window.scrollTo(0, 0);
  const st = View.state = {id:v.id, csort:"top", comments:[]};
  const count = list => list.reduce((n, c) => n + 1 + (c.replies || []).length, 0);
  const paintComments = () => {
    const a = [...st.comments].sort(st.csort === "top" ? (x,y) => y.likes - x.likes : (x,y) => new Date(y.createdAt) - new Date(x.createdAt));
    const n = count(a);
    $("#cmTitle").textContent = `${n} comment${n === 1 ? "" : "s"}`; $("#cmCount").textContent = n;
    paint($("#cmList"), a.length ? a.map(c => Comment(c, v.id)).join("") : `<li>${Empty({title:"No comments yet", text:"Be the first to share what this meant to you."})}</li>`);
  };
  View.reloadComments = async () => { const r = await API.comments(v.id); st.comments = r.items; paintComments(); };
  View.set = (k, val) => { st[k] = val; paintComments(); };
  const [rel, cm] = await Promise.all([API.related(v.id), API.comments(v.id)]);
  if (my !== token) return;
  paint($("#related"), rel.items.map(x => VideoCard(x, {compact:true})).join("") || `<p class="meta">No related videos yet.</p>`);
  st.comments = cm.items; paintComments();
}

/* ---- LISTEN ---- */
const LISTEN_TABS = [["discover","Discover"],["all","All music"],["worship","Worship"],["gospel","Gospel"],["instrumentals","Instrumentals"],["spoken-word","Spoken Word"],["playlists","Playlists"]];
const GENRES = ["worship","gospel","instrumentals","spoken-word"];
const LISTEN_SECTIONS = [
  {key:"featured", title:"Featured music", kind:"featured", params:{featured:1, limit:6}},
  {key:"new", title:"New releases", kind:"shelf", params:{sort:"new", limit:10}},
  {key:"trending", title:"Trending", kind:"ranked", params:{sort:"plays", limit:8}},
  {key:"g-worship", title:"Worship", kind:"shelf", params:{genre:"worship", sort:"plays", limit:10}, tab:"worship"},
  {key:"g-gospel", title:"Gospel", kind:"shelf", params:{genre:"gospel", sort:"plays", limit:10}, tab:"gospel"},
  {key:"g-instrumentals", title:"Instrumentals", kind:"shelf", params:{genre:"instrumentals", sort:"plays", limit:10}, tab:"instrumentals"},
  {key:"g-spoken-word", title:"Spoken Word", kind:"shelf", params:{genre:"spoken-word", sort:"plays", limit:10}, tab:"spoken-word"},
  {key:"playlists", title:"Playlists", kind:"playlists", tab:"playlists"}
];
const SECTION_RENDER = {
  featured:(items, s) => { Ctx.set(s.key, items); return `<div class="lhero-row">${items.map((t,i) => FeaturedTrack(t, s.key, i)).join("")}</div>`; },
  shelf:(items, s) => { Ctx.set(s.key, items); return `<div class="shelf">${items.map((t,i) => TrackCard(t, s.key, i)).join("")}</div>`; },
  ranked:(items, s) => { Ctx.set(s.key, items); return `<ul class="tlist">${items.map((t,i) => TrackRow(t, s.key, i, {rank:i + 1})).join("")}</ul>`; },
  playlists:items => `<div class="shelf">${items.map(PlaylistCard).join("")}</div>`
};

async function viewListen(qs){
  document.title = "Listen — AJEY CJEY";
  const st = {tab:qs.get("tab") || "discover", q:qs.get("q") || "", sort:"new", page:1, items:[], total:0};
  app.innerHTML = `
    <div class="wrap page"><header class="page-head"><h1>Listen</h1><p>Worship, gospel, instrumentals and spoken word. Press play and keep browsing, the music keeps going.</p></header>
    ${SearchBox({value:st.q, placeholder:"Search songs, artists or albums"})}</div>
    <div class="bar"><div class="chips" id="chips" role="group" aria-label="Music categories"></div></div>
    <div class="wrap" id="content"></div>`;
  const chips = () => paint($("#chips"), LISTEN_TABS.map(([k, n]) => Chip({label:n, key:"tab", value:k, active:st.tab === k})).join(""));
  chips();
  const content = $("#content");
  async function refresh(append){
    const run = ++token;
    const mode = st.q ? "library" : st.tab === "discover" ? "discover" : st.tab === "playlists" ? "playlists" : "library";
    if (mode === "discover"){
      paint(content, LISTEN_SECTIONS.map(s => `<section class="lsec" data-sec="${s.key}"><div class="sec-head"><h2>${esc(s.title)}</h2>${s.tab ? `<button class="linkbtn" type="button" data-action="set-filter" data-key="tab" data-value="${s.tab}">See all</button>` : ""}</div><div data-body>${s.kind === "ranked" ? Skel("r", 4) : `<div class="shelf">${Skel("s", 4)}</div>`}</div></section>`).join(""));
      LISTEN_SECTIONS.forEach(async s => {
        try {
          const r = s.kind === "playlists" ? await API.playlists() : await API.tracks(s.params);
          if (run !== token) return;
          const sec = $(`[data-sec="${s.key}"]`, content); if (!sec) return;
          if (!r.items.length){ sec.remove(); return; }
          paint($("[data-body]", sec), SECTION_RENDER[s.kind](r.items, s));
        } catch(_){ const sec = $(`[data-sec="${s.key}"]`, content); if (sec) sec.remove(); }
      });
      return;
    }
    if (mode === "playlists"){
      paint(content, `<section class="lsec"><div class="sec-head"><h2>Playlists</h2></div><div class="vgrid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))" data-body>${Skel("s", 4)}</div></section>`);
      const r = await API.playlists(); if (run !== token) return;
      paint($("[data-body]", content), r.items.length ? r.items.map(PlaylistCard).join("") : Empty({title:"No playlists yet"}));
      return;
    }
    // library (all music, a genre, or search results)
    const genre = GENRES.includes(st.tab) ? st.tab : "";
    if (!append){
      st.page = 1; st.items = [];
      paint(content, `<section class="lsec"><div class="sec-head"><h2 id="libTitle">Music library</h2>
        <select class="select" style="width:auto;min-height:44px" data-filter="sort" aria-label="Sort tracks"><option value="new"${st.sort==="new"?" selected":""}>Newest</option><option value="plays"${st.sort==="plays"?" selected":""}>Most played</option><option value="az"${st.sort==="az"?" selected":""}>A to Z</option></select></div>
        <div id="libBody">${Skel("r", 5)}</div><div class="more-wrap" id="more"></div></section>`);
    }
    const r = await API.tracks({q:st.q, genre, sort:st.sort, page:st.page, pageSize:CONFIG.libraryPageSize});
    if (run !== token) return;
    st.items = append ? st.items.concat(r.items) : r.items; st.total = r.total; Ctx.set("lib", st.items);
    const gName = (LISTEN_TABS.find(t => t[0] === st.tab) || [])[1];
    $("#libTitle").textContent = st.q ? `${st.total} result${st.total === 1 ? "" : "s"} for “${st.q}”` : genre ? `${gName} (${st.total})` : `All music (${st.total})`;
    paint($("#libBody"), st.items.length ? `<ul class="tlist">${st.items.map((t, i) => TrackRow(t, "lib", i)).join("")}</ul>` : Empty({title:"No music found", text:"Try a different search.", action:{action:"reset-filters", label:"Clear search"}}));
    $("#more").innerHTML = st.items.length < st.total ? `<button class="btn btn-outline" type="button" data-action="load-more">Show more songs</button>` : "";
  }
  View.state = st;
  View.set = (k, v) => {
    if (k === "q" && v && (st.tab === "discover" || st.tab === "playlists")){ st.tab = "all"; chips(); }
    st[k] = v; if (k === "tab") chips();
    setUrl("/listen", {tab:st.tab === "discover" ? "" : st.tab, q:st.q}); refresh(false);
  };
  View.reset = () => { st.q = ""; const i = $('[data-role="search"]'); i.value = ""; $(".clear", i.parentNode).classList.add("hidden"); setUrl("/listen", {tab:st.tab === "discover" ? "" : st.tab}); refresh(false); };
  View.more = () => { st.page++; refresh(true); };
  await refresh(false);
}

/* ---- playlist detail ---- */
async function viewPlaylist(id){
  const my = ++token;
  app.innerHTML = `<div class="wrap page">${Skel("r", 5)}</div>`;
  const p = await API.playlist(id); if (my !== token) return;
  if (!p){ app.innerHTML = `<div class="wrap page">${Empty({title:"Playlist not found"})}<p style="text-align:center;margin-top:16px"><a class="btn btn-primary" href="#/listen">BACK TO LISTEN</a></p></div>`; return; }
  document.title = p.title + " — AJEY CJEY"; Ctx.set("pl", p.tracks);
  const total = p.tracks.reduce((s, t) => s + (t.duration || 0), 0);
  paint(app, `<div class="wrap"><div style="padding-top:12px"><a class="back" href="#/listen">${I("back")}Back to Listen</a></div>
    <div class="pl-head">${Cover(p)}<div><h1>${esc(p.title)}</h1><p class="meta" style="margin-top:8px">${esc(p.description)}</p><p class="meta" style="margin-top:6px">${p.tracks.length} tracks, ${Math.round(total / 60)} min</p>
      <div class="btns"><button class="btn btn-primary" type="button" data-action="play-all" data-ctx="pl">${I("play")}PLAY ALL</button>
      <button class="btn btn-outline" type="button" data-action="shuffle-all" data-ctx="pl">${I("shuffle")}Shuffle</button>
      ${Toggle({action:"save", type:"playlist", id:p.id, label:"Save playlist", icon:"bookmark"})}
      <button class="act" type="button" data-action="share" data-title="${esc(p.title)}" data-path="/listen/playlist/${encodeURIComponent(p.id)}">${I("share")}Share</button></div></div></div>
    <div class="lsec"><ul class="tlist">${p.tracks.map((t, i) => TrackRow(t, "pl", i)).join("")}</ul></div></div>`);
  window.scrollTo(0, 0);
}

/* ---- router ---- */
const ROUTES = [
  [/^\/watch$/, viewWatch], [/^\/watch\/video\/([^/]+)$/, (qs, id) => viewVideo(decodeURIComponent(id))],
  [/^\/listen$/, viewListen], [/^\/listen\/playlist\/([^/]+)$/, (qs, id) => viewPlaylist(decodeURIComponent(id))]
];
async function route(){
  const raw = location.hash.slice(1) || "/watch", [path, q] = raw.split("?"), qs = new URLSearchParams(q || "");
  const tab = path.startsWith("/listen") ? "listen" : "watch";
  View.state = {}; View.set = () => {}; View.reset = () => {}; View.more = () => {}; View.reloadComments = async () => {};
  for (const [re, fn] of ROUTES){ const m = path.match(re); if (m){ if (!path.includes("/video/") && !path.includes("/playlist/")) window.scrollTo(0, 0); await fn(qs, ...m.slice(1)); return; } }
  app.innerHTML = `<div class="wrap page">${Empty({title:"Page not found"})}</div>`;
}
window.addEventListener("hashchange", route);
route();
</script>

<script>
/* shared nav: menu toggle + current-page marker */
(function(){
  const burger=document.getElementById("burger"), drawer=document.getElementById("drawer");
  function setMenu(o){burger.setAttribute("aria-expanded",o);burger.setAttribute("aria-label",o?"Close menu":"Open menu");drawer.classList.toggle("open",o);drawer.setAttribute("aria-hidden",!o);document.documentElement.style.overflow=o?"hidden":"";}
  burger.addEventListener("click",()=>setMenu(burger.getAttribute("aria-expanded")!=="true"));
  drawer.addEventListener("click",e=>{if(e.target.closest("a"))setMenu(false)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false)});
  matchMedia("(min-width:1000px)").addEventListener("change",e=>{if(e.matches)setMenu(false)});
  const page=location.pathname.split("/").pop()||"index.html";
  function mark(){
    const h=location.hash;
    const cur=page==="watch.html"?(h.startsWith("#/listen")?"listen":"watch"):
      page==="word.html"?(h.startsWith("#/prayer")?"prayer":h.startsWith("#/community")?"community":"word"):
      page==="account.html"?"me":"";
    document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  }
  addEventListener("hashchange",mark);mark();
})();
</script>
