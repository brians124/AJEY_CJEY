<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word, Prayer and Community — AJEY CJEY</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --night:#0d1033; --night-2:#171b57; --dawn:#f2a33a; --dawn-2:#ffd58a; --ember:#e8683a;
  --bg:#f5f6fb; --surface:#ffffff; --surface-2:#eceef8; --ink:#0f1233; --ink-2:#4a4f78;
  --line:#dcdff0; --accent:#a35d0b; --link:#2a30a3; --err:#b3261e; --err-bg:#fdecea; --ok:#1b7a46; --ok-bg:#e6f5ec;
  --shadow:0 1px 2px rgba(15,18,51,.06),0 10px 30px -12px rgba(15,18,51,.25);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:60px; --wrap:1160px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c26; --surface:#12153f; --surface-2:#1a1e52; --ink:#eef0ff; --ink-2:#a9aed6;
    --line:#262b66; --accent:#f2a33a; --link:#ffd58a; --err:#ff9c94; --err-bg:#3a1520; --ok:#7be3a6; --ok-bg:#12352a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c26; --surface:#12153f; --surface-2:#1a1e52; --ink:#eef0ff; --ink-2:#a9aed6;
  --line:#262b66; --accent:#f2a33a; --link:#ffd58a; --err:#ff9c94; --err-bg:#3a1520; --ok:#7be3a6; --ok-bg:#12352a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.7);
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night);scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--dawn);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.narrow{max-width:760px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{width:1em;height:1em;flex:none}
.meta{color:var(--ink-2);font-size:.88rem}
.hidden,[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;font-weight:800;letter-spacing:.05em;font-size:.9rem;white-space:nowrap;transition:transform .15s,background .15s,opacity .15s;border:2px solid transparent}
.btn:active{transform:scale(.97)}
.btn svg{font-size:1.15rem}
.btn-primary{background:linear-gradient(180deg,var(--dawn-2),var(--dawn));color:#1a1030;box-shadow:0 10px 26px -10px rgba(242,163,58,.8)}
.btn-solid{background:var(--night-2);color:#fff}
.btn-ghost{border-color:rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.07)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.btn-outline{border-color:var(--line);color:var(--ink);letter-spacing:.02em;font-weight:600}
.btn-outline:hover{background:var(--surface-2)}
.btn-wa{background:#25d366;color:#052e16;box-shadow:0 10px 26px -10px rgba(37,211,102,.7)}
.btn.block{width:100%}
.btn[disabled],.btn[aria-busy="true"]{opacity:.75;cursor:progress}
.linkbtn{color:var(--link);font-weight:600;font-size:.92rem;padding:8px 0}
.linkbtn:hover{text-decoration:underline}

.act{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;transition:background .15s,color .15s,border-color .15s}
.act svg{font-size:1.2rem}
.act:hover{background:var(--surface-2)}
.act[aria-pressed="true"] svg{fill:currentColor}
.act[data-action="save"][aria-pressed="true"],.act[data-action="prayed"][aria-pressed="true"]{color:var(--accent);border-color:currentColor}
.act.sm{min-height:40px;padding:0 14px}

/* ============ NAV ============ */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--nav-h);background:rgba(13,16,51,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:1.05rem}
.brand svg{width:28px;height:28px}

/* ============ SHELL + HEROES ============ */
#app{min-height:70vh;padding-bottom:56px}
.phero{position:relative;overflow:hidden;color:#fff;padding:44px 0 72px;isolation:isolate}
.phero::before{content:"";position:absolute;right:-25%;top:-55%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,213,138,.5),transparent 65%);z-index:-1}
.phero.word{background:linear-gradient(165deg,#171b57 0%,#3b2470 58%,#b8523f 135%)}
.phero.prayer{background:linear-gradient(165deg,#0d1033 0%,#1f2a6b 62%,#3b2470)}
.phero.community{background:linear-gradient(165deg,#171b57 0%,#2a1d68 55%,#e8683a 155%)}
.phero.sub{padding-bottom:44px}
.phero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,8.5vw,3.8rem);line-height:1.02;letter-spacing:-.02em;max-width:16ch}
.phero p.lead{font-family:var(--serif);font-size:clamp(1.1rem,4.2vw,1.35rem);line-height:1.45;color:rgba(255,255,255,.88);margin-top:14px;max-width:46ch}
.phero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
@media (max-width:520px){.phero .btns .btn{width:100%}}
.overlap{margin-top:-46px;position:relative;z-index:2}

.search{position:relative;margin-top:22px;max-width:560px}
.search input{width:100%;min-height:54px;border-radius:999px;border:2px solid transparent;background:#fff;color:#0f1233;padding:0 48px;font-size:1rem}
.search input:focus{border-color:var(--dawn);outline:none}
.search>svg{position:absolute;left:18px;top:50%;translate:0 -50%;font-size:1.2rem;color:#4a4f78;pointer-events:none}
.search .clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#4a4f78}
.search .clear:hover{background:#eceef8}

.bar{position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px));z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-top:26px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;max-width:var(--wrap);margin-inline:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;white-space:nowrap}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--night-2);border-color:var(--night-2);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--dawn);border-color:var(--dawn);color:#1a1030}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--dawn);border-color:var(--dawn);color:#1a1030}
.resultbar{margin:24px 0 16px}
.resultbar h2,.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.1;letter-spacing:-.01em}
.sec{margin-top:52px}
.sec-head{margin-bottom:18px}
.sec-head p{color:var(--ink-2);margin-top:6px;max-width:56ch}
.pill{display:inline-block;background:var(--surface-2);color:var(--ink);font-size:.78rem;font-weight:600;padding:3px 11px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* ============ WORD ============ */
.today{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:26px 22px 26px;display:grid;gap:18px}
.today .date{font-weight:600;color:var(--accent)}
.today h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.08;letter-spacing:-.01em;margin-top:4px}
.verse{font-family:var(--serif);font-style:italic;font-size:clamp(1.25rem,4.6vw,1.7rem);line-height:1.4;border-left:4px solid var(--dawn);padding-left:18px}
.verse cite{display:block;margin-top:10px;font-family:var(--body);font-style:normal;font-weight:600;font-size:.92rem;color:var(--ink-2)}
.today .ex{font-family:var(--serif);font-size:1.12rem;color:var(--ink-2)}
.today .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (min-width:860px){.today{grid-template-columns:1.05fr 1fr;gap:40px;padding:38px;align-items:center}}
.dgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.dcard{background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}

.dcard h3{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.25}
.dcard .vref{color:var(--accent);font-weight:600;font-size:.92rem}
.dcard .ex{font-family:var(--serif);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.dcard .meta{margin-top:auto;padding-top:4px}

.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--link);min-height:44px}
.back svg{font-size:1.2rem}
.article{padding-top:8px}
.article h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,7vw,2.9rem);line-height:1.06;letter-spacing:-.02em;margin:10px 0 8px}
.article .byline{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:.92rem;margin-bottom:26px}
.article .verse{background:var(--surface);border-radius:0 22px 22px 0;padding:22px 22px 22px 22px;box-shadow:var(--shadow)}
.prose{font-family:var(--serif);font-size:1.2rem;line-height:1.75;margin-top:28px;display:grid;gap:1.1em}
.box{background:var(--surface-2);border-radius:16px;padding:22px;margin-top:28px}
.box h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin-bottom:10px}
.box p{font-family:var(--serif);font-size:1.15rem;line-height:1.65}
.box ul{display:grid;gap:10px}
.box li{position:relative;padding-left:22px;font-family:var(--serif);font-size:1.12rem;line-height:1.5}
.box li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--dawn)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pager{display:grid;gap:12px;margin-top:34px}
.pager a{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:block}
.pager small{display:block;color:var(--ink-2);font-size:.82rem}
.pager b{font-family:var(--display);font-weight:600;line-height:1.25}
.pager .newer{text-align:right}
@media (min-width:640px){.pager{grid-template-columns:1fr 1fr}}

/* ============ PRAYER ============ */
.hub{display:grid;gap:16px}
@media (min-width:800px){.hub{grid-template-columns:1fr 1fr}}
.hubcard{background:var(--surface);border-radius:16px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.hubcard .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--dawn-2),var(--dawn));color:#1a1030;font-size:1.6rem}
.hubcard h2{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.hubcard p{color:var(--ink-2);flex:1}
.steps{display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.steps li::before{counter-increment:s;content:counter(s);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--night-2);color:#fff;font-weight:800;font-family:var(--display)}
.steps b{display:block;font-family:var(--display);font-weight:600}
.steps span{color:var(--ink-2)}
@media (min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}.steps li{grid-template-columns:1fr;gap:10px}}
.notice{display:flex;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px}
.notice>svg{font-size:1.6rem;color:var(--accent);margin-top:2px}
.notice b{display:block;font-family:var(--display);font-weight:600;margin-bottom:4px}
.notice ul{display:grid;gap:6px;margin-top:8px}
.notice li{position:relative;padding-left:18px;color:var(--ink-2);font-size:.94rem}
.notice li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.notice p{color:var(--ink-2);font-size:.94rem}
.notice.alert{border-color:transparent;background:var(--surface-2)}
.wall{display:grid;gap:16px}
@media (min-width:860px){.wall{grid-template-columns:1fr 1fr}}
.pc{background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.pc .ph{display:flex;gap:8px;flex-wrap:wrap}
.pc .ptext{font-family:var(--serif);font-size:1.15rem;line-height:1.6;overflow-wrap:anywhere}
.pc .answer{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 14px;font-size:.94rem}
.pc .pf{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:auto}
.pc .who{display:flex;flex-direction:column;flex:1;min-width:120px}
.pc .who b{font-family:var(--display);font-weight:600;line-height:1.2}
.pc .rep{color:var(--ink-2);font-size:.85rem;padding:8px 6px;min-height:44px}
.pc .rep:hover{text-decoration:underline}

/* ============ COMMUNITY ============ */
.cta-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:28px 22px;display:grid;gap:22px}
.cta-card h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.1}
.cta-card p{color:var(--ink-2);margin-top:8px}
.cta-card details{border-top:1px solid var(--line);padding-top:14px}
.cta-card summary{font-weight:600;cursor:pointer;min-height:36px;display:flex;align-items:center}
.cta-card details ul{display:grid;gap:8px;margin-top:10px}
.cta-card details li{position:relative;padding-left:18px;color:var(--ink-2)}
.cta-card details li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media (min-width:860px){.cta-card{grid-template-columns:1.3fr 1fr;align-items:center;padding:38px;gap:40px}}
.alist{display:grid;gap:12px}
.ann{background:var(--surface);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:grid;gap:6px}
.ann.pin{border:2px solid var(--dawn)}
.ann h3{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.25}
.ann p{color:var(--ink-2)}
.ann .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tgrid{display:grid;gap:16px}
@media (min-width:860px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tm{background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.tm blockquote{margin:0;font-family:var(--serif);font-size:1.15rem;line-height:1.55}
.tm.clamp blockquote{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tm .who{display:flex;align-items:center;gap:12px;margin-top:auto}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h,240) 60% 32%),hsl(calc(var(--h,240) + 40) 70% 52%))}
.tm .who b{display:block;line-height:1.2}
.youth{background:linear-gradient(140deg,var(--night),var(--night-2) 55%,#3b2470);color:#fff;border-radius:16px;padding:30px 22px;display:grid;gap:22px;box-shadow:var(--shadow)}
.youth h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05}
.youth p{color:rgba(255,255,255,.85);margin-top:10px}
.youth ul{display:grid;gap:10px}
.youth li{background:rgba(255,255,255,.08);border-radius:12px;padding:14px 16px}
.youth li b{display:block;font-family:var(--display);font-weight:600}
.youth li span{color:rgba(255,255,255,.75);font-size:.94rem}
.youth .safe{font-size:.88rem;color:rgba(255,255,255,.7);margin-top:14px}
@media (min-width:860px){.youth{grid-template-columns:1.1fr 1fr;padding:42px;gap:40px;align-items:center}}
.elist{display:grid;gap:14px}
.ev{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:86px 1fr;overflow:hidden}
.ev .dt{background:linear-gradient(170deg,var(--night-2),#3b2470);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;text-align:center}
.ev .dt b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.ev .dt span{font-size:.85rem;color:rgba(255,255,255,.8)}
.ev .bd{padding:16px 18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ev h3{font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.25}
.ev p{color:var(--ink-2);font-size:.95rem}
.ev .btn{min-height:44px;padding:0 20px;margin-top:6px}
@media (min-width:860px){.elist{grid-template-columns:1fr 1fr}}

/* ============ FORMS ============ */
.formcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:26px 20px}
@media (min-width:640px){.formcard{padding:34px}}
.form{display:grid;gap:20px}
.field{display:grid;gap:7px}
.field>label,.field legend{font-weight:600;line-height:1.3}
.field legend{padding:0;margin-bottom:8px}
.field fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{font-weight:400;color:var(--ink-2);font-size:.85rem;margin-left:6px}
.hint{color:var(--ink-2);font-size:.88rem;line-height:1.4}
.field input[type=text],.field input[type=email],.field input[type=tel],.field select,.field textarea{width:100%;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:1rem}
.field textarea{padding:14px 16px;min-height:150px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--dawn);outline:none;box-shadow:0 0 0 3px rgba(242,163,58,.25)}
.field.has-error input:not([type=checkbox]):not([type=radio]),.field.has-error select,.field.has-error textarea{border-color:var(--err)}
.err{color:var(--err);font-size:.9rem;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.err:empty{display:none}
.count{justify-self:end;font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.count.over{color:var(--err);font-weight:600}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;line-height:1.45}
.check input,.radio input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--night-2);flex:none}
.check b{font-weight:600}
.radios{display:grid;gap:10px}
.radio{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--bg)}
.radio:has(input:checked){border-color:var(--dawn);background:color-mix(in srgb,var(--dawn) 12%,var(--bg))}
.radio span b{display:block;font-weight:600}

.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.banner{border-radius:12px;padding:14px 16px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.banner.error{background:var(--err-bg);color:var(--err)}
.banner svg{font-size:1.25rem;margin-top:1px}
.banner small{display:block;font-weight:400;margin-top:2px}
.spin{display:none;width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}

@keyframes rot{to{transform:rotate(360deg)}}
.success{display:grid;gap:14px;justify-items:start;padding:6px 0;outline:none}

/* =====================================================================
   DATA SHAPES
   Devotional : { id, title, category(slug), verse, reference, translation, body:[p...], prayer, questions:[...],
                  author, publishedAt(ISO), readMins }
   PrayerWallItem (PUBLIC, already moderated) : { id, category, text, displayName|null, createdAt, prayedCount,
                  status:'active'|'answered', answerNote? }
        SERVER RULE: this endpoint must never return email, IP, private requests, or unapproved posts.
   Announcement: { id, title, text, date, pinned?, link?, linkLabel? }
   Testimony   : { id, name, place?, text, date, hue? }
   Event       : { id, title, startsAt(ISO), location, description, rsvpOpen }
   Lists       : { items:[...], total }
   ===================================================================== */
const ago = d => new Date(Date.now() - d * 864e5).toISOString();
const SAMPLE = { devoCats:[], devos:[], wall:[], prayerCats:[], announcements:[], testimonies:[], events:[], youth:{}, community:{} };
SAMPLE.devoCats = [["faith","Faith"],["hope","Hope"],["prayer","Prayer"],["purpose","Purpose"],["healing","Healing"],["family","Family"],["gratitude","Gratitude"],["youth","Youth"]].map(([slug,name]) => ({slug,name}));
SAMPLE.prayerCats = [["healing","Healing"],["family","Family"],["guidance","Guidance"],["provision","Provision"],["salvation","Salvation"],["thanksgiving","Thanksgiving"],["other","Other"]].map(([slug,name]) => ({slug,name}));
// id, daysAgo, category, title, reference, verse, p1, p2, prayer, q1, q2
[
 ["d1",0,"faith","He meets you where you are","James 4:8","Draw nigh to God, and he will draw nigh to you.",
  "You do not have to arrive polished. God is not waiting for the version of you that has it all together. He is inviting the real one: the tired one, the distracted one, the one with unanswered questions.",
  "Today, take one honest minute. Tell Jesus how the day really feels, and ask him to be near. Scripture promises that when we move toward God, he moves toward us. Nearness is his idea.",
  "Jesus, here I am, just as I am. Meet me in this day. Quiet my mind, steady my heart, and help me notice you. Amen.",
  "What am I carrying today that I have not yet handed to Jesus?","Where can I make five quiet minutes for him?"],
 ["d2",1,"prayer","Peace that makes no sense","Philippians 4:6-7","Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.",
  "Anxiety tells us to hold every problem tightly and think harder. Paul offers another way: bring it to God, with thanks, in plain words. Prayer does not always change the situation first. It often changes us first.",
  "Notice the promise. It is not that we will understand everything, but that God's peace will stand guard over our hearts and minds. Peace becomes a guard at the door of your thoughts.",
  "Father, I bring you what worries me. I say thank you for what you have already done. Guard my heart and mind with your peace. Amen.",
  "What is one worry I can turn into a prayer today?","What can I thank God for right now?"],
 ["d3",3,"hope","Do not be afraid","Isaiah 41:10","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.",
  "Fear is loud, especially at night. God does not answer it with a lecture. He answers with his presence: I am with you. Before he tells you what to do, he tells you who is beside you.",
  "Strength, help and support are all promised here, and none of them depend on how brave you feel. Courage is not the absence of fear. It is taking the next step because God is near.",
  "Lord, you know what I am afraid of. Remind me that you are with me. Give me strength for today's next step. Amen.",
  "What fear needs to hear that God is with me?","What is the next small step I can take?"],
 ["d4",5,"purpose","A hope and a future","Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.",
  "These words were written to people living far from home, in a season they did not choose. God did not promise a quick escape. He promised that his plans for them were good and that their story was not over.",
  "If you feel in-between today, waiting or unsure, this verse is for you. Purpose is not only found at the finish line. It is being formed in the waiting, one faithful day at a time.",
  "God, I trust that you are writing a good story, even here. Help me be faithful today, and give me hope for what is ahead. Amen.",
  "Where do I feel in-between right now?","How can I be faithful in this season?"],
 ["d5",7,"healing","Close to the brokenhearted","Psalm 34:18","The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.",
  "Grief and disappointment can make God feel far away. This verse says the opposite: he draws nearest when hearts are breaking. You do not need to hide your pain to be close to him.",
  "Healing is often slow, and it often begins with being honest. Tell God exactly where it hurts. Then let a trusted friend, pastor or counsellor walk with you as well. You were not made to heal alone.",
  "Jesus, my heart is heavy. Come close. Hold what is broken, and lead me toward healing, one step at a time. Amen.",
  "What pain have I been hiding from God?","Who could I let walk with me this week?"],
 ["d6",9,"faith","Trusting when you cannot see","Proverbs 3:5-6","Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.",
  "Trust is easy when the path is clear. It is a different thing when the way is hidden. Proverbs invites us to trust with all the heart, not only the parts that feel certain.",
  "Leaning on our own understanding is tempting because it feels safe. But God sees the whole road. Acknowledge him in the small decisions today, and he will direct the path.",
  "Lord, I do not see the whole way, but I trust you. Guide my decisions today and straighten my path. Amen.",
  "Where am I leaning only on my own understanding?","What decision can I bring to God today?"],
 ["d7",12,"gratitude","A grateful gate","Psalm 100:4","Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.",
  "Thanksgiving is a doorway. Before we ask for anything, the psalmist says we can walk in through gratitude. It turns our attention from what is missing to who is present.",
  "Try naming three gifts from today. Small ones count: a meal, a message, a moment of calm. Gratitude does not deny hard things. It simply refuses to let them have the last word.",
  "Thank you, Father, for your goodness. Open my eyes to your gifts today, and let my heart come home to praise. Amen.",
  "What three things can I thank God for today?","Who can I thank out loud this week?"],
 ["d8",14,"healing","Rest for the weary","Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest.",
  "Jesus does not say, come when you have improved. He says, come when you are tired. His invitation is for the weary and the overloaded, which is most of us at some point.",
  "Rest is not laziness. It is trust. Today, put something down on purpose: a task, a worry, a need to prove yourself. Sit with Jesus and let him carry what you cannot.",
  "Jesus, I am tired. I come to you. Give me rest for my body, my mind and my soul. Amen.",
  "What am I carrying that I was never meant to carry?","What would real rest look like this week?"],
 ["d9",17,"youth","An example in a small place","1 Timothy 4:12","Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.",
  "Timothy was young, and some people looked down on him. Paul's advice was not to argue or to wait until he was older. It was to live a life worth following, right where he was.",
  "You do not need a platform to be an example. Your words, your kindness and your integrity at school, at home and online are already telling a story. Let it be a story that points to Jesus.",
  "Lord, help me live as an example in what I say, how I love, and what I believe. Give me courage to stay true. Amen.",
  "Where can my life point to Jesus this week?","What would it look like to be an example online?"],
 ["d10",20,"family","Our house, our altar","Joshua 24:15","…but as for me and my house, we will serve the LORD.",
  "Joshua did not wait for everyone to agree. He decided for himself and his household. A family's faith often begins with one person quietly choosing to follow Jesus.",
  "That might look like a shared meal with a short prayer, a Bible verse on the fridge, or simply being the first to say sorry. Small, steady habits build a home where God is welcome.",
  "Father, bless our home. Help us love one another, forgive quickly, and welcome you into our days. Amen.",
  "What small habit could invite God into our home?","Who in my family needs a word of encouragement today?"],
 ["d11",23,"hope","Strong and not alone","Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.",
  "God commands courage, and then gives the reason: he is with you wherever you go. Courage is not a personality type. It is a response to a promise.",
  "Whatever is ahead today, an exam, a conversation, a new start, you are not walking into it by yourself. Take a breath, take the step, and remember who goes with you.",
  "God, I need courage. Thank you that you go with me. Help me take the next step with confidence in you. Amen.",
  "What am I facing that needs courage?","How does knowing God is with me change my next step?"],
 ["d12",26,"purpose","Working together for good","Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose.",
  "This verse does not say every event is good. It says God is at work in all things, weaving them toward good for those who love him. Even hard chapters are not wasted in his hands.",
  "You may not see the pattern yet. Purpose often makes sense looking backward. For today, hold on to the promise and keep loving God with what you have.",
  "Lord, I trust that you are working for good, even where I cannot see it. Help me keep loving you. Amen.",
  "What difficult thing am I struggling to trust God with?","Looking back, where have I seen God bring good from a hard season?"],
 ["d13",29,"prayer","Ask, and keep asking","Luke 11:9","And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.",
  "Jesus tells us to ask, seek and knock: words that keep going. Prayer is not a single try. It is a relationship, and persistence is part of trust.",
  "Bring your request again today, without embarrassment. God is not tired of hearing from you. He is a Father who delights when his children come.",
  "Father, I ask again. Give me patience as I wait, and faith to keep knocking. Amen.",
  "What have I stopped asking God for?","How can I keep praying with hope?"]
].forEach(r => { const words = (r[6] + " " + r[7] + " " + r[8]).split(/\s+/).length;
  SAMPLE.devos.push({id:r[0], publishedAt:ago(r[1]), category:r[2], title:r[3], reference:r[4], verse:r[5], translation:"KJV", body:[r[6], r[7]], prayer:r[8], questions:[r[9], r[10]], author:"AJEY CJEY Team", readMins:Math.max(2, Math.round(words / 180))}); });
// approved, public-safe sample posts only (first names or anonymous, no contact details)
[

 ["w7","guidance","Pray for our youth group as we plan an outreach this weekend.","Esther",9,23,"active"],
 ["w8","healing","Thank you for praying. My peace has returned and I am sleeping well again.",null,12,61,"answered","Peace came slowly, then all at once."]
].forEach(r => SAMPLE.wall.push({id:r[0], category:r[1], text:r[2], displayName:r[3], createdAt:ago(r[4]), prayedCount:r[5], status:r[6], answerNote:r[7] || ""}));

 {id:"a1", title:"Welcome to Gospel to the World", text:"Join our WhatsApp community to pray, share and stay in touch. Everyone is welcome.", date:ago(20), pinned:true},
 {id:"a2", title:"Online prayer night this Friday", text:"Join us at 8:00 PM for an hour of worship and prayer. Bring a friend.", date:ago(1)},
 {id:"a3", title:"New devotional series begins Monday", text:"Five days on trusting God in uncertain seasons. A new reading each morning.", date:ago(3)},
 {id:"a4", title:"Volunteers wanted for our media team", text:"Video, photography, design and writing. Tell us how you would like to serve.", date:ago(6)}
];
SAMPLE.testimonies = [
 {id:"m1", name:"Grace M.", place:"Kampala", text:"I came to a worship night tired and empty. I left knowing Jesus had seen me. The prayers from this community carried me through a very hard month, and I am grateful.", date:ago(4), hue:330},
 {id:"m2", name:"Daniel K.", place:"Entebbe", text:"The daily devotionals became my morning routine. A few minutes with Scripture and a prayer changed how I start every day, and my faith finally feels alive.", date:ago(9), hue:205},
 {id:"m3", name:"Ruth A.", place:"Jinja", text:"Watching the testimonies gave me courage to start the creative work God put in my heart. I did not think I was ready, but I took the first step.", date:ago(15), hue:30}
];

 {id:"e1", title:"Online prayer night", startsAt:ago(-2).slice(0,11) + "17:00:00.000Z", location:"Online, join from anywhere", description:"An hour of worship and prayer together.", rsvpOpen:true},
 {id:"e2", title:"Encounter Night", startsAt:ago(-9).slice(0,11) + "15:00:00.000Z", location:"Venue to be announced", description:"Live worship, a short message and time for prayer. Everyone is welcome.", rsvpOpen:true},
 {id:"e3", title:"Youth hangout", startsAt:ago(-12).slice(0,11) + "13:00:00.000Z", location:"Venue to be announced", description:"Games, music and honest conversation for young people.", rsvpOpen:true},

const page = (a, pg, size) => { const total = a.length; size = +size || total || 1; pg = +pg || 1; return {items:a.slice((pg-1)*size, pg*size), total}; };
const rid = n => Array.from({length:n}, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)]).join("");
const Sample = {
  fail(){ return location.hash.includes("fail=1"); },   // add ?fail=1 to any hash to test error states
  devos(p){
    let a = [...SAMPLE.devos];
    if (p.ids != null){ const s = String(p.ids).split(",").filter(Boolean); a = a.filter(d => s.includes(d.id)); }
    if (p.category) a = a.filter(d => d.category === p.category);
    if (p.q){ const q = p.q.toLowerCase(); a = a.filter(d => (d.title + " " + d.reference + " " + d.verse + " " + d.body.join(" ")).toLowerCase().includes(q)); }
    a.sort((x, y) => new Date(y.publishedAt) - new Date(x.publishedAt));
    return page(a, p.page, p.pageSize);
  },
  devo(id){
    const a = [...SAMPLE.devos].sort((x, y) => new Date(y.publishedAt) - new Date(x.publishedAt)), i = a.findIndex(d => d.id === id);
    if (i < 0) return null; const s = d => d && {id:d.id, title:d.title};
    return {...a[i], newer:s(a[i-1]), older:s(a[i+1])};
  },
  wall(p){
    let a = [...SAMPLE.wall];
    if (p.status) a = a.filter(x => x.status === p.status);
    if (p.category) a = a.filter(x => x.category === p.category);
    a.sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt));
    return page(a, p.page, p.pageSize);
  }
};

/* =====================================================================
   API
   GET  /devotionals/today                     -> Devotional
   GET  /devotionals?q&category&ids&page&pageSize -> {items,total}
   GET  /devotionals/:id                       -> Devotional (+ newer:{id,title}, older:{id,title})
   GET  /devotional-categories                 -> [{slug,name}]
   GET  /prayer-wall?category&status&page&pageSize -> {items,total}  (approved + public only)
   POST /prayer-requests {anonymous,name?,email?,category,text,visibility,consent} -> {reference,status:'received'|'pending_review'}
   POST /prayer-wall/:id/prayed {on}           POST /prayer-wall/:id/report {reason,note?}
   GET  /community  /announcements  /testimonies  /community/youth  /events
   POST /testimonies {anonymous,name?,place?,text,consent} -> {reference}
   POST /events/:id/rsvp {name,contact,guests}  -> {reference}
   POST /reactions {kind,type,id,on}
   ===================================================================== */
const delay = ms => new Promise(r => setTimeout(r, ms));
async function remote(path, {method = "GET", params, body} = {}, sample){
  if (CONFIG.apiBase){
    try {
      const u = new URL(CONFIG.apiBase.replace(/\/$/, "") + path);
      Object.entries(params || {}).forEach(([k, v]) => { if (v !== "" && v != null) u.searchParams.set(k, v); });
      const r = await fetch(u, {method, headers:{Accept:"application/json", ...(body ? {"Content-Type":"application/json"} : {})}, body:body ? JSON.stringify(body) : undefined});
      if (r.ok) return r.status === 204 ? {} : await r.json();
      if (!CONFIG.fallbackToSample) throw new Error("API " + r.status);
    } catch (e) { if (!CONFIG.fallbackToSample) throw e; }
  }
  await delay(method === "GET" ? 140 : 900);
  return sample();
}

  def.fields.forEach(f => { if (f.type === "textarea") count(f); });
  applyVisibility();
  form.addEventListener("focusout", e => { const w = e.target.closest("[data-field]"); if (!w) return; const f = def.fields.find(x => x.name === w.dataset.field), vals = raw(); if (f && visible(f, vals)) setErr(f, check(f, vals)); });
  form.addEventListener("input", e => { const w = e.target.closest("[data-field]"); if (!w) return; const f = def.fields.find(x => x.name === w.dataset.field); if (f && f.type === "textarea") count(f); if (w.classList.contains("has-error")) setErr(f, check(f, raw())); });
  form.addEventListener("change", () => { applyVisibility(); const vals = raw(); def.fields.forEach(f => { if (f.type === "textarea") count(f); if (el(f.name).classList.contains("has-error") && visible(f, vals)) setErr(f, check(f, vals)); }); });
  form.addEventListener("submit", async e => {
    e.preventDefault(); if (loading) return; banner.hidden = true;
    const {vals, bad} = validateAll();
    if (bad.length){ showBanner(`Please check ${bad.length === 1 ? "one field" : bad.length + " fields"} below.`); const first = $("input:not([type=hidden]),select,textarea", el(bad[0].name)); if (first) first.focus(); return; }
    const hp = $('[name="hp"]', form).value;
    const succeed = (res) => { host.innerHTML = `<div class="success" tabindex="-1" role="status">${def.success(res, vals, ctx)}</div>`; const s = $(".success", host); s.focus({preventScroll:true}); s.scrollIntoView({block:"nearest"}); };
    if (hp){ succeed({reference:"AJ-" + rid(5), status:"received"}); return; }        // bots: look successful, send nothing
    if (Date.now() - (lastSent[def.id] || 0) < CONFIG.cooldownMs){ showBanner("Please wait a moment before sending again.", "This helps us keep the community safe."); return; }
    const payload = {}; def.fields.forEach(f => { if (visible(f, vals)) payload[f.name] = vals[f.name]; });
    setLoading(true);
    try {
      const res = await Promise.race([def.submit(payload, ctx), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), CONFIG.submitTimeoutMs))]);
      lastSent[def.id] = Date.now(); succeed(res || {});
    } catch (err) {
      setLoading(false);
      showBanner(err && err.message === "timeout" ? "This is taking too long." : "We could not send this right now.", "Your words are still here and nothing was lost. Check your connection and try again.");
      banner.scrollIntoView({block:"nearest"});
    }
  });
  return form;
}

/* ---- modal ---- */
const Modal = {
  el:null, last:null,
  open(title, def, ctx){
    this.close(true); this.last = document.activeElement;
    const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mT"><div class="sheet-head"><h2 id="mT">${esc(title)}</h2><button class="xbtn" type="button" data-action="modal-close" aria-label="Close">${I("close")}</button></div><div data-host></div></div>`;
    m.addEventListener("click", e => { if (e.target === m) Modal.close(); });
    document.body.appendChild(m); this.el = m; $("#shell").inert = true;
    mountForm($("[data-host]", m), def, ctx); const f = $("input:not([type=checkbox]):not([tabindex]),select,textarea", m); if (f) f.focus();
  },
  close(silent){ if (!this.el) return; this.el.remove(); this.el = null; $("#shell").inert = false; if (!silent && this.last && this.last.focus) this.last.focus(); }
};

/* =====================================================================
   ACTIONS (event delegation on data-action)
   ===================================================================== */
const View = {state:{}, set(){}, reset(){}, more(){}, reload(){}};
const Actions = {
  save(el){ const on = Store.toggle("saves", el.dataset.type, el.dataset.id); syncToggles(); API.react("save", el.dataset.type, el.dataset.id, on); toast(on ? "Saved to your library" : "Removed from saved"); },
  prayed(el){ const on = Store.toggle("prayed", "wall", el.dataset.id); syncToggles(); API.prayed(el.dataset.id, on); if (on) toast("Thank you for praying"); },
  share(el){ share({title:el.dataset.title, path:el.dataset.path}); },
  "set-filter"(el){ View.set(el.dataset.key, el.dataset.value); },
  "reset-filters"(){ View.reset(); }, "load-more"(){ View.more(); }, reload(el){ View.reload(el.dataset.section); },
  "clear-search"(){ const i = $('[data-role="search"]'); i.value = ""; i.focus(); View.set("q", ""); },
  "toggle-more"(el){ const c = el.closest(".tm").classList.toggle("clamp"); el.textContent = c ? "Read more" : "Show less"; },
  wa(el, e){ if (/REPLACE_WITH/.test(el.dataset.url)){ e.preventDefault(); toast("Add your WhatsApp invite link in CONFIG to turn this on"); } },
  rsvp(el){ const ev = Ctx.events.find(x => x.id === el.dataset.id); if (ev) Modal.open("RSVP: " + ev.title, FormDefs.rsvp(ev), ev); },
  "share-testimony"(){ Modal.open("Share your testimony", FormDefs.testimony()); },
  report(el){ Modal.open("Report a post", FormDefs.report(el.dataset.id)); },
  "modal-close"(){ Modal.close(); },
  "form-reset"(el){ const host = el.closest("[data-host]"); if (host){ const h = Hosts.get(host); mountForm(host, h.def, h.ctx); const f = $("input:not([type=checkbox]):not([tabindex]),select,textarea", host); if (f) f.focus(); } }
};
const Ctx = {events:[]};
document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (el && Actions[el.dataset.action]) Actions[el.dataset.action](el, e); });
let searchT;
document.addEventListener("input", e => { const s = e.target.closest('[data-role="search"]'); if (s){ $(".clear", s.parentNode).classList.toggle("hidden", !s.value); clearTimeout(searchT); searchT = setTimeout(() => View.set("q", s.value.trim()), 250); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") Modal.close(); });

  View.set = (k, v) => { st[k] = v; setUrl("/prayer/wall", {cat:st.cat === "all" ? "" : st.cat}); chips(); refresh(false); };
  View.reset = () => { st.cat = "all"; chips(); setUrl("/prayer/wall", {}); refresh(false); };
  View.more = () => { st.page++; refresh(true); };
  await refresh(false);
}

/* ---- router ---- */
const ROUTES = [
  [/^\/word$/, viewWord], [/^\/word\/([^/]+)$/, (qs, id) => viewDevo(decodeURIComponent(id))],
  [/^\/prayer$/, viewPrayer], [/^\/prayer\/request$/, viewPrayerRequest], [/^\/prayer\/wall$/, viewPrayerWall],
  [/^\/community$/, viewCommunity]
];
async function route(){
  Modal.close(true);
  const raw = location.hash.slice(1) || "/word", [path, q] = raw.split("?"), qs = new URLSearchParams(q || "");
  const tab = path.split("/")[1];
  View.state = {}; View.set = () => {}; View.reset = () => {}; View.more = () => {}; View.reload = () => {};
  window.scrollTo(0, 0);
  for (const [re, fn] of ROUTES){ const m = path.match(re); if (m){ await fn(qs, ...m.slice(1)); return; } }
  app.innerHTML = `<div class="wrap" style="padding-top:28px">${Empty({title:"Page not found", action:{action:"reset-filters", label:"Back to Word"}})}</div>`; View.reset = () => { location.hash = "#/word"; };
}
window.addEventListener("hashchange", route);
route();

<script>
/* shared nav: menu toggle + current-page marker */
(function(){
  const burger=document.getElementById("burger"), drawer=document.getElementById("drawer");
  function setMenu(o){burger.setAttribute("aria-expanded",o);burger.setAttribute("aria-label",o?"Close menu":"Open menu");drawer.classList.toggle("open",o);drawer.setAttribute("aria-hidden",!o);document.documentElement.style.overflow=o?"hidden":"";}
  burger.addEventListener("click",()=>setMenu(burger.getAttribute("aria-expanded")!=="true"));
  drawer.addEventListener("click",e=>{if(e.target.closest("a"))setMenu(false)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")setMenu(false)});
  matchMedia("(min-width:1000px)").addEventListener("change",e=>{if(e.matches)setMenu(false)});
  const page=location.pathname.split("/").pop()||"index.html";
  function mark(){
    const h=location.hash;
    const cur=page==="watch.html"?(h.startsWith("#/listen")?"listen":"watch"):
      page==="word.html"?(h.startsWith("#/prayer")?"prayer":h.startsWith("#/community")?"community":"word"):
      page==="account.html"?"me":"";
    document.querySelectorAll("[data-nav]").forEach(a=>{if(a.dataset.nav===cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  }
  addEventListener("hashchange",mark);mark();
})();
</script>
